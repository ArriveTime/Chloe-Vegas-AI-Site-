<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Your Vegas VIP Journey with Chloe. Discover Las Vegas luxury resorts, fine dining, nightlife, entertainment, shopping, spas and unforgettable experiences.">
<meta name="theme-color" content="#160b29">
<title>Your Vegas VIP Journey | Meet Chloe</title>

<style>
:root {
  --bg: #14091f;
  --panel: #251435;
  --gold: #f7d28a;
  --pink: #e84da9;
  --white: #fff;
  --muted: #dfd2e8;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  display: block;
  max-width: 100%;
}

.top-line {
  height: 5px;
  background: linear-gradient(
    90deg,
    #ff54b6,
    #f7d28a,
    #4ed8ff,
    #a26aff
  );
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(17, 7, 29, 0.97);
  border-bottom: 1px solid rgba(247, 210, 138, 0.35);
}

nav {
  max-width: 1250px;
  margin: auto;
  padding: 17px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.logo {
  color: var(--gold);
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 1px;
}

.nav-links {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 13px;
  font-weight: bold;
}

.nav-links a:hover {
  color: var(--gold);
}

.hero {
  background:
    linear-gradient(
      90deg,
      rgba(13, 5, 27, 0.94),
      rgba(20, 7, 38, 0.7)
    ),
    url("https://images.unsplash.com/photo-1605833556294-ea5c7a74f57d?auto=format&fit=crop&w=2000&q=90");
  background-position: center;
  background-size: cover;
}

.hero-inner {
  max-width: 1250px;
  margin: auto;
  padding: 65px 22px;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: 45px;
  align-items: center;
}

.hero-inner > * {
  min-width: 0;
}

.eyebrow {
  color: var(--gold);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 3px;
}

.hero h1 {
  font-family: Georgia, serif;
  font-size: clamp(40px, 6vw, 76px);
  line-height: 1.08;
  margin: 18px 0;
}

.hero h1 span {
  color: var(--gold);
}

.hero p {
  max-width: 580px;
  color: #f2e5f9;
  font-size: 18px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 26px;
}

.btn {
  display: inline-block;
  padding: 14px 21px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: bold;
  text-align: center;
  transition: transform 0.2s;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-gold {
  background: linear-gradient(120deg, #ffebbd, #e7b85e);
  color: #231029;
}

.btn-outline {
  border: 1px solid var(--gold);
  background: rgba(20, 9, 35, 0.75);
}

.chloe-card {
  width: 100%;
  max-width: 400px;
  justify-self: center;
  background: rgba(31, 16, 48, 0.97);
  padding: 14px;
  border: 1px solid rgba(247, 210, 138, 0.65);
  border-radius: 18px;
  text-align: center;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
}

.chloe-photo {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
  background: #362042;
}

.chloe-photo img {
  width: 100%;
  height: auto;
  max-height: 550px;
  object-fit: contain;
  object-position: center top;
}

.chloe-card h2 {
  color: var(--gold);
  font-family: Georgia, serif;
  font-size: 31px;
  margin: 16px 0 4px;
}

.chloe-card p {
  color: #e9dced;
  font-size: 14px;
  margin: 8px 0;
}

.wrap {
  max-width: 1250px;
  margin: auto;
  padding: 65px 22px;
}

.section-heading {
  max-width: 850px;
  margin: 0 auto 38px;
  text-align: center;
}

.section-heading small {
  color: var(--gold);
  font-weight: bold;
  letter-spacing: 2px;
}

.section-heading h2 {
  font-family: Georgia, serif;
  font-size: clamp(30px, 4vw, 44px);
  margin: 12px 0;
}

.section-heading p {
  color: var(--muted);
}

.experiences {
  background: #1b0e30;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #29173b;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
  transition: transform 0.2s, border-color 0.2s;
}

.card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
}

.card-image {
  width: 100%;
  height: 210px;
  background: #43265b;
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-content {
  padding: 21px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.card-content h3 {
  font-family: Georgia, serif;
  color: var(--gold);
  font-size: 22px;
  margin: 0 0 9px;
}

.card-content p {
  color: #e7dbe9;
  font-size: 14px;
  margin: 0 0 18px;
  flex: 1;
}

.card-content a {
  color: #ffe3aa;
  font-size: 13px;
  font-weight: bold;
}

.resorts {
  background: #11091e;
}

.resort-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 15px;
}

.resort {
  min-width: 0;
  min-height: 100px;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(135deg, #472558, #241234);
  border: 1px solid rgba(247, 210, 138, 0.5);
  border-radius: 11px;
  font-family: Georgia, serif;
  font-size: 18px;
  font-weight: bold;
  overflow-wrap: anywhere;
  transition: background 0.2s;
}

.resort:hover {
  background: #62377a;
  color: var(--gold);
}

.cta {
  background: linear-gradient(
    120deg,
    #8b286d,
    #50238a,
    #183d78
  );
  text-align: center;
}

.cta h2 {
  font-family: Georgia, serif;
  font-size: clamp(30px, 4vw, 44px);
  color: #ffe5ab;
  margin-top: 0;
}

.cta p {
  max-width: 780px;
  margin: 15px auto 26px;
}

.disclaimers {
  background: #0e0718;
  color: #cbbdd4;
  font-size: 13px;
  padding: 35px 22px;
  border-top: 1px solid rgba(247, 210, 138, 0.25);
}

.disclaimers-inner {
  max-width: 1150px;
  margin: auto;
}

.disclaimers h3 {
  color: var(--gold);
  font-size: 17px;
}

footer {
  padding: 34px 18px;
  text-align: center;
  background: #080410;
  color: #cbbdd4;
}

footer strong {
  color: var(--gold);
  font-family: Georgia, serif;
  font-size: 24px;
}

footer p {
  font-size: 12px;
}

@media (max-width: 950px) {
  .hero-inner {
    grid-template-columns: 1fr;
    text-align: center;
    max-width: 750px;
    padding: 48px 20px;
  }

  .hero p {
    margin-left: auto;
    margin-right: auto;
  }

  .buttons {
    justify-content: center;
  }

  .cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .resort-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  nav {
    padding: 14px;
  }

  .logo {
    font-size: 17px;
  }

  .nav-links {
    font-size: 11px;
    gap: 12px;
  }

  .hero-inner {
    padding: 38px 15px;
    gap: 30px;
  }

  .hero h1 {
    font-size: clamp(35px, 10vw, 52px);
  }

  .hero p {
    font-size: 16px;
  }

  .chloe-card {
    max-width: 360px;
  }

  .wrap {
    padding: 48px 15px;
  }

  .cards {
